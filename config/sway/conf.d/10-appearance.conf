set $fg #e0def4
set $bg #0c0c18
set $ac #f2c8c7
font pango:Iosevka Nerd Font 8
floating_modifier Mod1
floating_maximum_size 2000 x 1600
gaps inner 10
gaps outer 10
default_border pixel 0
hide_edge_borders vertical
client.focused $ac $ac $bg $ac $ac
client.focused_inactive $bg $bg $fg $bg $bg
client.unfocused $bg $bg $fg $bg $bg
client.urgent $bg $bg $fg $bg $bg
corner_radius 8
blur enable
blur_passes 1
blur_radius 2
shadows enable
shadow_blur_radius 5
shadow_color #00000055
# Sway owns the wallpaper; no process needs to be restarted on reload.
output * bg $bg solid_color
seat * xcursor_theme catppuccin-mocha-pink-cursors 32
