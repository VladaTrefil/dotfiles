# exec runs once at session start; reload does not duplicate these processes.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec ibus-daemon -drx
exec dunst
exec swayidle -w timeout 300 '$HOME/.config/sway/bin/lock' timeout 600 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"' before-sleep '$HOME/.config/sway/bin/lock'
