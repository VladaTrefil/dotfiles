# exec runs once at session start; reload does not duplicate these processes.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec ibus start --type wayland
exec dunst
# swayidle receives each action as one argument and runs it through `sh -c`.
# Single quotes here would reach swayidle literally, so $HOME would never expand
# and the lock could never fire - invisible to every static check, because the
# config parses, the binding exists and the script works when run directly.
# Let sway expand $HOME, and keep the inner sh quoting for the swaymsg arguments.
exec swayidle -w \
    timeout 7200 "$HOME/.config/sway/bin/lock" \
    timeout 7800 "swaymsg 'output * dpms off'" \
    resume "swaymsg 'output * dpms on'" \
    before-sleep "$HOME/.config/sway/bin/lock"
