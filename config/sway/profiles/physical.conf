# Measured on Fedora/Radeon: G3223Q left, U2720Q right.
output DP-1 mode 3840x2160@143.963Hz position 0 0 scale 1 bg ~/.background/mountains-blue-and-beige.jpg fill $bg
output DP-2 mode 2560x1440@59.951Hz position 3840 0 scale 1 bg ~/.background/mountains-blue-and-gold.jpg fill $bg
workspace $ws1 output DP-1
workspace $ws2 output DP-1
workspace $ws3 output DP-1
workspace $ws4 output DP-2
workspace $ws5 output DP-2
workspace $ws6 output DP-2
workspace $ws7 output DP-2
workspace $ws8 output DP-2
workspace $ws9 output DP-2
exec sh -c 'eww daemon && eww open --arg monitor=DP-1 bar'
