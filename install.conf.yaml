- defaults:
    link:
      relink: false
      force: false
    create:
      mode: 0700

- create:
    # Parent of all config links; install supplies the default XDG paths.
    - $XDG_CONFIG_HOME
    - $XDG_CONFIG_HOME/codespell
    - $XDG_CONFIG_HOME/ibus
    - $XDG_CONFIG_HOME/qt5ct/colors
    - $XDG_CONFIG_HOME/qt6ct/colors
    - $XDG_CONFIG_HOME/gtk-3.0
    - $XDG_CONFIG_HOME/gtk-4.0
    - $XDG_CONFIG_HOME/environment.d
    - $XDG_CONFIG_HOME/autostart
    # Individual shell links leave room for private work.sh outside the checkout.
    - $XDG_CONFIG_HOME/shell
    # Shell and less must be able to persist their history on first use.
    - $XDG_STATE_HOME/zsh
    - $XDG_STATE_HOME/less
    # Completion dumps and the pinned theme's compiled runtime copy live here.
    - $XDG_CACHE_HOME/zsh
    # wgetrc uses Wget's tilde expansion and the fixed default HSTS cache.
    - ~/.cache
    # BUNDLE_USER_CONFIG names a file; this is its containing directory.
    - $XDG_CONFIG_HOME/bundle
    - $XDG_DATA_HOME/applications
    - ~/.local/bin

- link:
    $XDG_CONFIG_HOME/git: config/git
    $XDG_CONFIG_HOME/nvim: modules/nvim
    $XDG_CONFIG_HOME/shell/profile: config/shell/profile
    $XDG_CONFIG_HOME/shell/aliases.sh: config/shell/aliases.sh
    $XDG_CONFIG_HOME/shell/inputrc: config/shell/inputrc
    $XDG_CONFIG_HOME/zsh: config/zsh
    $XDG_CONFIG_HOME/wgetrc: config/wgetrc
    ~/.zshenv: config/zsh/.zshenv
    $XDG_CONFIG_HOME/asdf: config/asdf
    ~/.tool-versions: config/asdf/tool-versions
    $XDG_CONFIG_HOME/stylelint: config/stylelint
    $XDG_CONFIG_HOME/stylua: config/stylua
    $XDG_CONFIG_HOME/rubocop: config/rubocop
    $XDG_CONFIG_HOME/solargraph: config/solargraph
    $XDG_CONFIG_HOME/codespell/ignore.txt: config/codespell/ignore.txt
    $XDG_CONFIG_HOME/codespell/exclude-file.txt: config/codespell/exclude-file.txt
    $XDG_CONFIG_HOME/npm: config/npm
    $XDG_CONFIG_HOME/pry: config/pry
    $XDG_CONFIG_HOME/bat: config/bat
    $XDG_CONFIG_HOME/lazygit: config/lazygit
    $XDG_CONFIG_HOME/pylintrc: config/pylintrc
    $XDG_CONFIG_HOME/sway: config/sway
    $XDG_CONFIG_HOME/eww: config/eww
    $XDG_CONFIG_HOME/qt6ct/qt6ct.conf: config/qt6ct/qt6ct.conf
    $XDG_CONFIG_HOME/qt6ct/colors/Catppuccin-Mocha.conf: config/qt-palette/Catppuccin-Mocha.conf
    $XDG_CONFIG_HOME/qt5ct/colors/Catppuccin-Mocha.conf: config/qt-palette/Catppuccin-Mocha.conf
    $XDG_CONFIG_HOME/rofi: config/rofi
    $XDG_CONFIG_HOME/dunst: config/dunst
    $XDG_CONFIG_HOME/kitty: config/kitty
    $XDG_CONFIG_HOME/gtk-3.0/settings.ini: config/gtk-3.0/settings.ini
    $XDG_CONFIG_HOME/gtk-4.0/settings.ini: config/gtk-4.0/settings.ini
    $XDG_CONFIG_HOME/environment.d/50-desktop.conf: config/environment.d/50-desktop.conf
    $XDG_CONFIG_HOME/mimeapps.list: config/mimeapps.list
    $XDG_CONFIG_HOME/zed: config/zed
    $XDG_CONFIG_HOME/autostart/protonmail-bridge.desktop: local/autostart/protonmail-bridge.desktop
    $XDG_DATA_HOME/applications/lf.desktop: local/applications/lf.desktop
    ~/.local/bin/ydl-clip.sh: local/bin/ydl-clip.sh
    ~/.XCompose: config/compose/XCompose
    $XDG_CONFIG_HOME/ibus/Compose:
      path: config/compose/XCompose
      force: true
